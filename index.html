<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zug Augsburg</title>
<meta name="description" content="Live-Abfahrten München Hbf ↔ Augsburg für Hin- und Rückfahrt">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zug Augsburg">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #111827; --muted: #6b7280; --line: #e5e7eb;
    --ok: #15803d; --ok-bg: #dcfce7; --warn: #b45309; --warn-bg: #fef3c7; --bad: #b91c1c; --bad-bg: #fee2e2;
    --accent: #1d4ed8; --accent-bg: #dbeafe; --chip: #ef4444;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1120; --card: #131c2e; --text: #e5e7eb; --muted: #94a3b8; --line: #1f2a40;
      --ok: #4ade80; --ok-bg: #12301f; --warn: #fbbf24; --warn-bg: #3a2c0b; --bad: #f87171; --bad-bg: #3b1414;
      --accent: #93c5fd; --accent-bg: #172554;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  button { font: inherit; border: 0; border-radius: 12px; padding: 10px 14px; cursor: pointer;
    background: var(--card); color: var(--text); box-shadow: 0 0 0 1px var(--line) inset; }
  button:active { transform: scale(0.97); }
  .icon-btn { width: 44px; height: 44px; padding: 0; display: grid; place-items: center; font-size: 20px; }
  .card { background: var(--card); border-radius: 16px; padding: 14px 16px; box-shadow: 0 0 0 1px var(--line) inset; margin-bottom: 12px; }
  .hero { padding: 16px; }
  .hero.ok { background: var(--ok-bg); box-shadow: none; }
  .hero.warn { background: var(--warn-bg); box-shadow: none; }
  .hero.bad { background: var(--bad-bg); box-shadow: none; }
  .hero.none { background: var(--accent-bg); box-shadow: none; }
  .hero .k { font-size: 13px; color: var(--muted); }
  .hero .big { font-size: 26px; font-weight: 700; margin: 4px 0 2px; letter-spacing: -0.01em; }
  .hero .state { font-weight: 600; }
  .ok .state { color: var(--ok); } .warn .state { color: var(--warn); } .bad .state { color: var(--bad); }
  .list { padding: 4px 0; }
  .row { display: grid; grid-template-columns: 58px 1fr auto; gap: 10px; align-items: center;
    padding: 12px 16px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row.mine { background: var(--accent-bg); }
  .row.gone { opacity: 0.45; }
  .time { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px; }
  .time s { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
  .chip { display: inline-block; background: var(--chip); color: #fff; font-weight: 700; font-size: 12px;
    border-radius: 6px; padding: 2px 6px; margin-right: 6px; }
  .dest { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--muted); font-size: 13px; }
  .badge { font-size: 13px; font-weight: 700; border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
  .b-ok { color: var(--ok); background: var(--ok-bg); }
  .b-warn { color: var(--warn); background: var(--warn-bg); }
  .b-bad { color: var(--bad); background: var(--bad-bg); }
  .empty, .err { padding: 18px 16px; color: var(--muted); }
  .gap { text-align: center; color: var(--muted); padding: 4px 0; border-top: 1px solid var(--line); letter-spacing: 4px; }
  .err { color: var(--bad); }
  .foot { color: var(--muted); font-size: 12px; text-align: center; margin-top: 8px; }
  dialog { border: 0; border-radius: 18px; padding: 0; width: min(96vw, 420px); background: var(--card); color: var(--text); }
  dialog::backdrop { background: rgba(0,0,0,0.45); }
  .dlg { padding: 16px; }
  .dlg h2 { margin: 0 0 4px; font-size: 18px; }
  .dlg p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 14px;
    background: var(--card); box-shadow: 0 0 0 1px var(--line) inset; margin-bottom: 12px; }
  .tabs button { box-shadow: none; background: transparent; border-radius: 10px; padding: 9px 0; font-weight: 600; color: var(--muted); }
  .tabs button[aria-selected="true"] { background: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { .tabs button[aria-selected="true"] { color: #0b1120; } }
  .day { display: grid; grid-template-columns: 30px minmax(0, 1fr) minmax(0, 1fr); align-items: center; gap: 6px; margin: 8px 0; font-size: 15px; }
  .day span:first-child { overflow: hidden; text-overflow: ellipsis; }
  .day.head { margin: 0; color: var(--muted); font-size: 12px; }
  .day input { font: inherit; font-size: 15px; padding: 8px 6px; border-radius: 10px; border: 1px solid var(--line); min-width: 0;
    background: var(--bg); color: var(--text); width: 100%; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }
  .primary { background: var(--accent); color: #fff; box-shadow: none; }
  @media (prefers-color-scheme: dark) { .primary { color: #0b1120; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">München Hbf → Augsburg</h1>
      <div class="sub" id="updated">Lädt …</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="icon-btn" id="refresh" aria-label="Aktualisieren">↻</button>
      <button class="icon-btn" id="settings" aria-label="Vorlesungszeiten">⚙︎</button>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" data-dir="out" aria-selected="true">Hinfahrt</button>
    <button role="tab" data-dir="home" aria-selected="false">Rückfahrt</button>
  </div>

  <div class="card hero none" id="hero">
    <div class="k" id="hero-k">Heute</div>
    <div class="big" id="hero-big">–</div>
    <div class="state" id="hero-state"></div>
  </div>

  <div class="card list" id="list"><div class="empty">Lädt Abfahrten …</div></div>
  <div class="foot" id="source"></div>
</div>

<dialog id="dlg">
  <form method="dialog" class="dlg" id="form">
    <h2>Vorlesungszeiten</h2>
    <p>Beginn der ersten und Ende der letzten Vorlesung. Leer lassen, wenn du an dem Tag nicht nach Augsburg fährst. Wird nur auf diesem Handy gespeichert.</p>
    <div id="days"></div>
    <div class="actions">
      <button value="cancel" formnovalidate>Abbrechen</button>
      <button value="save" class="primary">Speichern</button>
    </div>
  </form>
</dialog>

<script>
const LINES = ["RE9", "RE86", "RE87", "RB86", "RB87", "RE80", "RE89"];   // all regional lines München Hbf -> Augsburg
const DELAY_WARN = 5;
const OUT_WINDOW = [80, 40];       // way there: "your train" leaves 80-40 min before the first lecture
const HOME_BUFFER = 0;             // way home: earliest train right when the last lecture ends ...
const HOME_WINDOW = 40;            // ... and the normal choice is within the 40 min after that
const DAYS = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag"];
const SHORT = ["Mo", "Di", "Mi", "Do", "Fr"];
const KEY = "train-board-lectures";
const DIRS = {
  // way there: her lines from München Hbf (a terminus, so all of them leave towards Augsburg)
  out:  { title: "München Hbf → Augsburg", stop: "de:09162:100", onlyLines: true, towards: null },
  // way home: every regional train from Bahnhof Haunstetterstraße heading to München
  home: { title: "Haunstetterstr. → München", stop: "de:09761:111", onlyLines: false, towards: /münchen/i },
};
const $ = (id) => document.getElementById(id);
const norm = (s) => String(s || "").replace(/\s+/g, "").toUpperCase();
const hm = (d) => d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
const at = (base, hhmm) => { const [h, m] = hhmm.split(":").map(Number); const d = new Date(base); d.setHours(h, m, 0, 0); return d; };
const real = (d) => d.planned.getTime() + d.delay * 60000;
const isBad = (d) => d.cancelled || d.delay >= DELAY_WARN;
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// lectures: { dayIndex(0=Mon): { start: "HH:MM", end: "HH:MM" } }  (older versions stored just "HH:MM")
function loadLectures() {
  let v = {};
  try { v = JSON.parse(localStorage.getItem(KEY)) || {}; } catch {}
  for (const k in v) if (typeof v[k] === "string") v[k] = { start: v[k] };
  return v;
}
function saveLectures(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {} }
const today = () => loadLectures()[new Date().getDay() - 1] || null;   // getDay: 0=Sun, 1=Mon

// ---- data: MVV timetable server (EFA, behind the MVV app), includes DB regional trains ----
const REGIONAL = 13;   // EFA product class for regional trains (RE/RB)
// The MVV server doesn't let websites load its data directly (CORS), so requests go through
// a small Cloudflare Worker (relay/worker.js). Put its address here:
const RELAY = "https://zug-relay.liam-galetzki0.workers.dev";
// Berlin date/time strings for MVV's "departures from ..." option
function berlinStamp(d) {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Berlin", year: "numeric", month: "2-digit",
    day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(d).map((x) => [x.type, x.value]));
  return { date: p.year + p.month + p.day, time: p.hour + p.minute };
}
// start: optional Date - departures from then on (MVV only sends ~150, mostly trams, so a later
// train window needs its own request). Returns deps plus "horizon": how far the data reaches.
async function loadDepartures(dir, start = null) {
  const cfg = DIRS[dir];
  if (!RELAY) throw new Error("Relay-Adresse fehlt (RELAY in index.html)");
  let url = RELAY.replace(/\/$/, "") + "/?stop=" + encodeURIComponent(cfg.stop);
  if (start) { const b = berlinStamp(start); url += "&date=" + b.date + "&time=" + b.time; }
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error("MVV " + r.status);
  const data = await r.json();
  const events = data.stopEvents || [];
  const horizon = new Date(Math.max(0, ...events.map((e) => Date.parse(e.departureTimePlanned) || 0)));
  const deps = events.map((e) => {
    const tr = e.transportation || {}, props = (e.location && e.location.properties) || {};
    const planned = new Date(e.departureTimePlanned), est = e.departureTimeEstimated ? new Date(e.departureTimeEstimated) : null;
    return {
      line: norm(tr.number || tr.disassembledName), cls: tr.product && tr.product.class,
      planned, delay: est ? Math.max(0, Math.round((est - planned) / 60000)) : 0, realtime: !!est,
      cancelled: !!e.isCancelled, dest: (tr.destination && tr.destination.name) || "?",
      platform: props.platformName || props.platform || "",
    };
  }).filter((d) => !isNaN(d.planned) && (cfg.onlyLines ? LINES.includes(d.line) : d.cls === REGIONAL)
                   && (!cfg.towards || cfg.towards.test(d.dest)));
  return { source: "MVV", deps, horizon };
}

// ---- choosing "your train" ----
function status(d) {
  if (d.cancelled) return { cls: "bad", text: "fällt aus" };
  if (d.delay >= DELAY_WARN) return { cls: "warn", text: "+" + d.delay + " Min" };
  if (d.delay > 0) return { cls: "ok", text: "+" + d.delay + " Min" };
  return { cls: "ok", text: d.realtime === false ? "planmäßig" : "pünktlich" };
}
const where = (d) => d.line + " · " + hm(d.planned) + (d.platform ? " · Gleis " + d.platform : "");
const cap = (t) => t[0].toUpperCase() + t.slice(1);

function evaluate(deps, from, to, now, lateText, horizon) {
  if (horizon && to > horizon && !deps.some((d) => d.planned >= from && d.planned <= to))
    return { mine: null, cls: "none", big: "Zug " + hm(from) + "–" + hm(to), st: "Noch keine Daten so weit im Voraus – später nochmal schauen" };
  const inWin = deps.filter((d) => d.planned >= from && d.planned <= to);
  const disrupted = inWin.filter(isBad);
  const mine = inWin.find((d) => !isBad(d))
    || deps.filter((d) => !d.cancelled && d.planned >= from).sort((a, b) => real(a) - real(b))[0] || null;
  if (!inWin.length && from > now)
    return { mine, cls: "bad", big: "Kein Zug " + hm(from) + "–" + hm(to),
             st: mine ? "Nächster Zug: " + where(mine) : "Keine Verbindung gefunden – DB Navigator prüfen" };
  if (!inWin.length)
    return { mine, cls: "none", big: mine ? where(mine) : "Kein Zug mehr", st: mine ? "Nächster Zug · " + status(mine).text : "" };
  if (!disrupted.length)
    return { mine, cls: "ok", big: where(mine), st: cap(status(mine).text) };
  const first = disrupted[0];
  const what = first.line + " " + hm(first.planned) + ": " + status(first).text
    + (disrupted.length > 1 ? " (+" + (disrupted.length - 1) + " weiterer)" : "");
  if (mine && mine.planned <= to)
    return { mine, cls: isBad(mine) ? "bad" : "warn", big: "Nimm " + where(mine) + (mine.delay > 0 ? " (+" + mine.delay + ")" : ""),
             st: isBad(mine) ? "Alle Züge gestört – das ist der schnellste" : what };
  if (mine) return { mine, cls: "bad", big: "Nimm " + where(mine), st: what + " · " + lateText };
  return { mine, cls: "bad", big: "Alle Züge gestört", st: what + " · DB Navigator prüfen" };
}

// ---- rendering ----
let dir = null, userPicked = false;
function autoDir() {
  const lec = today();
  return lec && lec.start && new Date() >= at(new Date(), lec.start) ? "home" : "out";
}
function setDir(d) {
  dir = d; $("title").textContent = DIRS[d].title;
  document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.dir === d)));
}

// today's train window for the current tab: { from, to, k, lateText } or { k, big, st } if there is none
function trainWindow(now) {
  const lec = today();
  if (dir === "out") {
    if (!lec || !lec.start) return { k: "Heute", big: "Keine Vorlesung eingetragen", st: "Über ⚙︎ Vorlesungszeiten eintragen" };
    const lecture = at(now, lec.start), k = "Vorlesung heute " + lec.start;
    if (lecture < now) return { k, big: "Vorlesung hat begonnen", st: "Für den Heimweg: Rückfahrt" };
    return { k, from: new Date(lecture - OUT_WINDOW[0] * 60000), to: new Date(lecture - OUT_WINDOW[1] * 60000),
             lateText: "Achtung: kommt später an" };
  }
  if (!lec || !lec.end) return { k: "Heute", big: "Ende der Vorlesung eintragen", st: "Über ⚙︎, dann zeige ich deinen Zug nach Hause" };
  const ready = new Date(at(now, lec.end).getTime() + HOME_BUFFER * 60000);
  return { k: "Vorlesung endet " + lec.end + (HOME_BUFFER ? " · Zug ab " + hm(ready) : ""), from: ready,
           to: new Date(ready.getTime() + HOME_WINDOW * 60000), lateText: "Achtung: später zuhause" };
}

function render(result) {
  const now = new Date();
  const upcoming = result.deps.filter((d) => real(d) >= now.getTime() - 60000).sort((a, b) => a.planned - b.planned);
  const w = trainWindow(now);
  const r = w.from ? evaluate(upcoming, w.from, w.to, now, w.lateText, result.horizon)
                   : { mine: null, cls: "none", big: w.big, st: w.st };
  $("hero").className = "card hero " + r.cls;
  $("hero-k").textContent = w.k; $("hero-big").textContent = r.big; $("hero-state").textContent = r.st;

  const list = upcoming.slice(0, 10);
  const later = r.mine && !list.includes(r.mine);   // her train is further ahead: show it below the next trains
  const row = (d) => {
    const s = status(d);
    const time = d.delay >= 1 && !d.cancelled ? `${hm(new Date(real(d)))}<s>${hm(d.planned)}</s>` : hm(d.planned);
    const meta = [d.platform ? "Gleis " + escapeHtml(d.platform) : "", d === r.mine ? "dein Zug" : ""].filter(Boolean).join(" · ");
    return `<div class="row${d === r.mine ? " mine" : ""}">
      <div class="time">${time}</div>
      <div><div class="dest"><span class="chip">${d.line}</span>${escapeHtml(d.dest)}</div><div class="meta">${meta}</div></div>
      <div class="badge b-${s.cls}">${s.text}</div></div>`;
  };
  $("list").innerHTML = !list.length
    ? `<div class="empty">${dir === "out" ? "Keine Züge nach Augsburg" : "Keine Regionalzüge nach München"} in den nächsten Stunden.</div>`
    : list.map(row).join("") + (later ? '<div class="gap">· · ·</div>' + row(r.mine) : "");
  $("updated").textContent = "Stand " + hm(now) + " · aktualisiert jede Minute";
  $("source").textContent = "Daten: MVV";
}

let busy = false;
async function refresh() {
  if (busy) return; busy = true;
  if (!userPicked) setDir(autoDir());
  $("refresh").textContent = "…";
  try {
    const res = await loadDepartures(dir);
    const w = trainWindow(new Date());
    if (w.from && w.to > res.horizon) {   // her window is further ahead than the first batch reaches
      try {
        const more = await loadDepartures(dir, new Date(w.from.getTime() - 15 * 60000));
        const seen = new Set(res.deps.map((d) => d.line + d.planned.getTime()));
        res.deps.push(...more.deps.filter((d) => !seen.has(d.line + d.planned.getTime())));
        res.horizon = new Date(Math.max(res.horizon, more.horizon));
      } catch (e) { /* keep the first batch; the top card then says it's too early */ }
    }
    render(res);
  }
  catch (e) {
    $("list").innerHTML = '<div class="err">Abfahrten konnten nicht geladen werden.<br><small>' + escapeHtml(e.message) + "</small></div>";
    $("updated").textContent = "Fehler beim Laden";
    $("hero").className = "card hero bad"; $("hero-k").textContent = "Keine Live-Daten";
    $("hero-big").textContent = "Bitte DB Navigator nutzen"; $("hero-state").textContent = "Gleich nochmal mit ↻ versuchen";
  } finally { busy = false; $("refresh").textContent = "↻"; }
}

// ---- settings dialog ----
function openSettings() {
  const v = loadLectures();
  $("days").innerHTML = '<div class="day head"><span></span><span>Beginn</span><span>Ende</span></div>' +
    DAYS.map((name, i) => `<div class="day"><span title="${name}">${SHORT[i]}</span>
      <input type="time" name="s${i}" value="${(v[i] && v[i].start) || ""}" aria-label="${name} Beginn">
      <input type="time" name="e${i}" value="${(v[i] && v[i].end) || ""}" aria-label="${name} Ende"></div>`).join("");
  $("dlg").showModal();
}
$("dlg").addEventListener("close", () => {
  if ($("dlg").returnValue !== "save") return;
  const v = {}, f = $("form").elements;
  DAYS.forEach((_, i) => { const s = f["s" + i].value, e = f["e" + i].value; if (s || e) v[i] = { start: s, end: e }; });
  saveLectures(v); userPicked = false; refresh();
});
document.querySelectorAll(".tabs button").forEach((b) =>
  b.addEventListener("click", () => { userPicked = true; setDir(b.dataset.dir); refresh(); }));
$("settings").addEventListener("click", openSettings);
$("refresh").addEventListener("click", refresh);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
setInterval(refresh, 60000);
refresh();
</script>

</body>
</html>
